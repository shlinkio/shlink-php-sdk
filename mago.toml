#:schema https://mago.carthage.software/1.27.1/schema.json
# Welcome to Mago!
# For full documentation, see https://mago.carthage.software/tools/overview
version = "1"
php-version = "8.4.0"
extends = "vendor/shlinkio/shlink-mago-config/mago.toml"

[source]
workspace = "."
paths = ["src", "test", "test-integration"]
includes = ["vendor"]

[source.glob]
literal-separator = true

[linter.rules]
no-literal-password = { exclude = ["test"] }
no-empty-catch-clause = { exclude = ["test"] }
no-empty-loop = { exclude = ["test"] }
loop-does-not-iterate = { exclude = ["test"] }

[analyzer]
baseline = "mago-analyze-baseline.toml"
ignore = [
    { code = "mixed-assignment", in = ["test/", "test-integration/"] },
    { code = "mixed-argument", in = ["test/", "test-integration/"] },
    { code = "mixed-operand", in = ["test/", "test-integration/"] },
    { code = "invalid-method-access", in = ["test/", "test-integration/"] },
    { code = "string-member-selector", in = ["test/", "test-integration/"] },
    { code = "invalid-array-element-key", in = ["test/", "test-integration/"] },
    { code = "possibly-false-argument", in = ["test/", "test-integration/"] },
]
